<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jolty Wikis</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d14;
      color: #f4f8fb;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(900px, calc(100% - 32px));
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      display: grid;
      place-items: center;
      min-height: 240px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      background: #121a24;
      color: #f4f8fb;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(24, 224, 122, 0.55);
      background: #172331;
    }

    .card img {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    .card strong {
      display: block;
      font-size: 28px;
    }

    .card span {
      display: block;
      margin-top: 6px;
      color: #a9b7c6;
      font-size: 15px;
    }

    @media (max-width: 680px) {
      .cards {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Jolty Wikis</h1>

    <div class="cards">
      <a class="card" href="https://jolty.us/animatedframes-wiki/">
        <div>
          <img src="AnimatedFrames-Wiki/assets/animatedframes-logo.webp" alt="AnimatedFrames">
          <strong>AnimatedFrames</strong>
          <span>Abrir wiki</span>
        </div>
      </a>

      <a class="card" href="https://jolty.us/quickhud-wiki/">
        <div>
          <img src="QuickHud-Wiki/assets/quickhud-logo.webp" alt="QuickHud">
          <strong>QuickHud</strong>
          <span>Abrir wiki</span>
        </div>
      </a>
    </div>
  </main>
</body>
</html>
