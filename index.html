<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunny - Wikis</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff8ff;
      background:
        linear-gradient(180deg, rgba(6, 5, 12, 0.48), rgba(6, 5, 12, 0.86)),
        #08070d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    a {
      color: inherit;
    }

    .nav {
      width: min(980px, calc(100% - 28px));
      min-height: 62px;
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(8, 7, 13, 0.7);
      backdrop-filter: blur(18px);
    }

    .brand,
    .button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff8ff;
      text-decoration: none;
      font-weight: 850;
    }

    .brand {
      border-color: transparent;
      background: transparent;
      padding-left: 4px;
    }

    .logo-dot {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff7ce5, #ffe08a);
      color: #130812;
      font-weight: 950;
    }

    main {
      min-height: calc(100vh - 80px);
      display: grid;
      place-items: center;
      padding: 54px 18px;
    }

    .panel {
      width: min(900px, 100%);
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(14, 10, 22, 0.68);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      text-align: center;
      backdrop-filter: blur(22px);
    }

    .kicker {
      margin: 0 0 14px;
      color: #ffe08a;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 52px;
      line-height: 1;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .card {
      min-height: 230px;
      display: grid;
      place-items: center;
      gap: 10px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff8ff;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .card:hover,
    .button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 124, 229, 0.7);
      background: rgba(255, 255, 255, 0.12);
    }

    .card img {
      width: 108px;
      height: 108px;
      object-fit: contain;
    }

    .card strong {
      font-size: 24px;
    }

    .card span {
      color: rgba(255, 244, 255, 0.72);
      font-weight: 800;
    }
