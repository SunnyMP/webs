<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunny - Wikis</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #fff8ff;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 124, 229, 0.22), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(255, 224, 138, 0.18), transparent 28%),
        linear-gradient(180deg, rgba(6, 5, 12, 0.5), rgba(6, 5, 12, 0.9)),
        #08070d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    a {
      color: inherit;
    }

    .wikis-page {
      min-height: 100vh;
    }

    .nav {
      width: min(980px, calc(100% - 28px));
      min-height: 62px;
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(8, 7, 13, 0.7);
      backdrop-filter: blur(18px);
    }

    .brand,
    .nav-wiki {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff8ff;
      text-decoration: none;
      font-weight: 850;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .brand {
      border-color: transparent;
      background: transparent;
      padding-left: 4px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, #ff7ce5, #ffe08a);
      color: #130812;
      font-size: 22px;
      font-weight: 950;
      line-height: 1;
    }

    .wiki-main {
      min-height: calc(100vh - 80px);
      display: grid;
      place-items: center;
      padding: 54px 18px;
    }

    .glass-panel {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(14, 10, 22, 0.68);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(22px);
    }

    .wiki-panel {
      width: min(900px, 100%);
      padding: 28px;
      text-align: center;
    }

    .kicker {
      margin: 0 0 14px;
      color: #ffe08a;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 52px;
      line-height: 1;
    }

    .wiki-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .wiki-card {
      min-height: 230px;
      display: grid;
      place-items: center;
      gap: 10px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff8ff;
      text-decoration: none;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .wiki-card:hover,
    .nav-wiki:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 124, 229, 0.7);
      background: rgba(255, 255, 255, 0.12);
    }

    .wiki-card img {
      width: 108px;
      height: 108px;
      object-fit: contain;
    }

    .wiki-card strong {
      font-size: 24px;
    }

    .wiki-card span {
      color: rgba(255, 244, 255, 0.72);
      font-weight: 800;
    }

    @media (max-width: 680px) {
      .nav {
        width: min(100% - 20px, 980px);
      }

      .wiki-list {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="wikis-page">
    <header class="nav">
      <a class="brand" href="./">
        <span class="brand-logo">S</span>
        <span>Sunny</span>
      </a>
      <a class="nav-wiki" href="portafolio/">Portfolio</a>
    </header>

    <main class="wiki-main">
      <section class="wiki-panel glass-panel">
        <p class="kicker">Wikis</p>
        <h1>Documentacion</h1>
        <div class="wiki-list">
          <a class="wiki-card" href="https://jolty.us/animatedframes-wiki/">
            <img src="https://cdn.modrinth.com/data/mAbDCyw6/74a82e58dea3dfe66207b816080cdd5dd7ec01b8_96.webp" alt="AnimatedFrames">
            <strong>AnimatedFrames</strong>
            <span>Abrir wiki</span>
          </a>
          <a class="wiki-card" href="https://jolty.us/quickhud-wiki/">
            <img src="https://cdn.modrinth.com/data/5PKXNBei/4e4de8a229acf646d5ea5a88e4ee101ad631a60d_96.webp" alt="QuickHud">
            <strong>QuickHud</strong>
            <span>Abrir wiki</span>
          </a>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
